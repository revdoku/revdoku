        type: string
      style: simple
    DomainId:
      explode: false
      in: path
      name: domain_id
      required: true
      schema:
        type: string
      style: simple
    AccountPathId:
      description: Granted account to read.
      explode: false
      in: path
      name: account_id
      required: true
      schema:
        pattern: ^acct_
        type: string
      style: simple
    IncludeStorage:
      description: Include backing file IDs for file-browser integrations.
      explode: true
      in: query
      name: include_storage
      required: false
      schema:
        default: false
        type: boolean
      style: form
  responses:
    Error:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
      description: Request failed. See error.code. 429 and some 503 responses include
        Retry-After.
  schemas:
    ActionReason:
      description: "Optional purpose for this action. AI agents should explain intentional\
        \ reads and changes when known; omit when unknown. Do not include secrets,\
        \ file contents, or transcripts."
      maxLength: 2000
      nullable: true
      type: string
    Pagination:
      description: "One page of a list. Request the next page with cursor=next_cursor\
        \ and the same filters. Cursors are opaque strings: do not build or decode\
        \ them."
      example:
        limit: 16
        has_more: true
        next_cursor: next_cursor
      properties:
        limit:
          maximum: 200
          minimum: 1
          type: integer
        has_more:
          description: True when another page exists.
          type: boolean
        next_cursor:
          description: Cursor for the next page; null on the last page. Email lists
            always return a cursor so that you can poll for new mail.
          nullable: true
          type: string
      required:
      - has_more
      - limit
      - next_cursor
      type: object
    DeleteResult:
      example:
        deleted: true
        id: id
      properties:
        deleted:
          type: boolean
        id:
          description: ID of the deleted resource. A webhook delete returns the mailbox
            ID.
          type: string
      required:
      - deleted
      - id
      type: object
    Download:
      description: Temporary download link. Fetch url without an API key. Request
        a new link after it expires.
      example:
        url: https://openapi-generator.tech
        filename: filename
        content_type: content_type
        expires_in: 0
        size_bytes: 0
      properties:
        url:
          format: uri
          type: string
        filename:
          type: string
        content_type:
          nullable: true
          type: string
        expires_in:
          description: Seconds until the link expires.
          enum:
          - 900
          type: integer
        size_bytes:
          format: int64
          minimum: 0
          type: integer
      required:
      - content_type
      - expires_in
      - filename
      - size_bytes
      - url
      type: object
    ErrorCode:
      description: Documented values of error.code. Treat an unknown code as a generic
        failure for its HTTP status.
      enum:
      - ACCOUNT_ACCESS_UNAVAILABLE
      - ACCOUNT_ADMIN_REQUIRED
      - ACCOUNT_CONNECTION_LIMIT_REACHED
      - ACCOUNT_FILE_LIMIT_EXCEEDED
      - ACCOUNT_READ_ONLY
      - ACCOUNT_SELECTOR_CONFLICT
      - ACCOUNT_SUSPENDED
      - AGENCY_ACCOUNT_REQUIRED
      - AGENT_CONNECTION_LIMIT_REACHED
      - CLIENT_ACCOUNT_LIMIT_REACHED
      - CONFLICT
