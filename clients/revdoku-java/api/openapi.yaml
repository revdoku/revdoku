openapi: 3.0.3
info:
  description: "Email mailboxes for people and AI agents, with private file storage.\
    \ Create mailboxes, read messages and attachments, and store additional files.\
    \ Create your account at https://app.revdoku.com/users/sign_up. This document\
    \ covers selected endpoints; see https://revdoku.com/api.md for the complete API."
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Revdoku public agent API
  version: 2.0.1
servers:
- description: Revdoku application API
  url: https://api.revdoku.com
paths:
  /v1/status:
    get:
      operationId: getRevdokuStatus
      parameters:
      - description: Select a granted account for this request only; omit for the
          credential's default account.
        explode: true
        in: query
        name: account_id
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: reason
        required: false
        schema:
          $ref: "#/components/schemas/ActionReason"
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getRevdokuStatus_200_response"
          description: "Current account, account types, client names, accessible parent\
            \ agencies, fixed credential default, and granted accounts."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Request failed; see error.code and error.details. A 503 EMAIL_INDEX_BUILDING\
            \ includes Retry-After: 5."
      security:
      - bearerAuth: []
      summary: Read current account identity and granted accounts
      x-accepts:
      - application/json
  /v1/accounts:
    get:
      operationId: listAccounts
      parameters:
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 100
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: offset
        required: false
        schema:
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listAccounts_200_response"
          description: Granted account data. Selecting an account never changes the
            credential default.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Request failed; see error.code and error.details. A 503 EMAIL_INDEX_BUILDING\
            \ includes Retry-After: 5."
      security:
      - bearerAuth: []
      summary: List accounts granted to this credential
      x-accepts:
      - application/json
    post:
      operationId: createClientAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createClientAccount_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createClientAccount_201_response"
          description: Created client identity with its granted parent in data.account.
            The credential default is unchanged.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Agency owner authorization required or account capacity reached
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Request failed; see error.code and error.details. A 503 EMAIL_INDEX_BUILDING\
            \ includes Retry-After: 5."
      security:
      - bearerAuth: []
      summary: Create a client account within an authorized agency
      x-content-type: application/json
      x-accepts:
      - application/json
  /v1/mailboxes/{id}/email:
    get:
      description: "Requires upload/write access. Anyone knowing the address can send;\
        \ reading files requires mailbox authorization. Original message.eml, decoded\
        \ message.json, and attachments are stored together."
      operationId: getMailboxEmailSettings
      parameters:
      - description: Authorized mailbox prefix ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - description: Explicitly granted account; omission uses credential default
        explode: true
        in: query
        name: account_id
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: reason
        required: false
        schema:
          $ref: "#/components/schemas/ActionReason"
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getMailboxEmailSettings_200_response"
          description: Mailbox email configuration
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Mailbox upload access required
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Mailbox unavailable
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Request failed; see error.code and error.details. A 503 EMAIL_INDEX_BUILDING\
            \ includes Retry-After: 5."
      security:
      - bearerAuth: []
      summary: Read a mailbox email address and limits
      x-accepts:
      - application/json
  /v1/mailboxes/{id}/email/rotate:
    post:
      description: "Requires write access and confirmation. Rotations stay on the\
        \ current domain unless domain is supplied. A ready custom domain requires\
        \ account eligibility and exact tenant ownership; platform recovers to the\
        \ default platform domain. Custom activation returns 202; poll the existing\
        \ email endpoint until assignment.status is active or failed. The old address\
        \ remains current until successful commit, which charges once. Read /v1/account/limits\
        \ for the rotation allowance; do not hard-code plan allowances. Never use\
        \ or synthesize a pending address. Free address changes return EMAIL_NAMES_UPGRADE_REQUIRED\
        \ with an upgrade_url. Optional username chooses a custom name and additionally\
        \ requires a paid plan and a full-account owner/administrator, an available\
        \ platform domain or a ready customer-owned domain (with deployment support\
        \ for custom domains). Blank/null names are invalid. Unchanged saves cost\
        \ no rotation. Named addresses may be reused only in their original account\
        \ once no primary, alias or pending assignment holds them; archived mailboxes\
        \ retain addresses. Retired addresses do not forward. Assignment history survives\
        \ mailbox deletion. Optional keep_old_as_alias retains the old primary for\
        \ the same mailbox, requiring full-account administrator access and an available\
        \ alias slot. Free has no aliases; query account limits for the effective\
        \ cap. Retention commits atomically with activation."
      operationId: rotateMailboxEmailAddress
      parameters:
      - description: Authorized mailbox prefix ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/rotateMailboxEmailAddress_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getMailboxEmailSettings_200_response"
          description: Mailbox email configuration
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Write access required; custom names additionally require full-account
            owner/administrator access.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Mailbox unavailable
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Address changed, assignment pending/conflicting, custom name\
            \ unavailable, custom domain unavailable, or named assignments disabled.\
            \ Read the structured error code and reread state before retrying."
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Confirmation/current address missing, or EMAIL_NAME_INVALID."
        "423":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Account is read-only
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: EMAIL_ROTATION_LIMIT; plan disallows rotation or monthly allowance
            is exhausted.
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getMailboxEmailSettings_200_response"
          description: Pending activation. The returned address is still the current
            address. Poll GET email.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Request failed; see error.code and error.details. A 503 EMAIL_INDEX_BUILDING\
            \ includes Retry-After: 5."
      security:
      - bearerAuth: []
      summary: Replace a mailbox email address after confirmation
      x-content-type: application/json
      x-accepts:
      - application/json
  /v1/mailboxes:
    get:
      description: "List active mailboxes by default. Returns permitted email addresses,\
        \ current email and unread counts, lifetime receipts and receiving state.\
        \ Counts and pagination cover only authorized mailboxes. No message content\
        \ is read."
      operationId: listMailboxes
      parameters:
      - description: Select another granted account; otherwise use the credential
          default.
        explode: true
        in: query
        name: account_id
        required: false
        schema:
          type: string
        style: form
      - description: Case-insensitive contains-filter on the permitted email address
          or ID.
        explode: true
        in: query
        name: q
        required: false
        schema:
          maxLength: 500
          type: string
        style: form
      - description: "Archive status: active, archived or all. Defaults to active."
        explode: true
        in: query
        name: status
        required: false
        schema:
          default: active
          enum:
          - active
          - archived
          - all
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 100
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMailboxes_200_response"
          description: Success
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Request failed; see error.code and error.details. A 503 EMAIL_INDEX_BUILDING\
            \ includes Retry-After: 5."
      security:
      - bearerAuth: []
      summary: List accessible mailboxes
      x-accepts:
      - application/json
    post:
      description: "Creates a mailbox with file storage and waits for receiving confirmation.\
        \ On Free, email.username is a prefix with a permanent 12-character random\
        \ suffix. An exact name requires a paid plan. Omit email.username for a generated\
        \ name. On confirmation failure, EMAIL_NOT_READY includes the retained mailbox_id.\
        \ Creation quotas apply."
      operationId: createMailbox
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createMailbox_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              example:
                success: true
                data:
                  mailbox:
                    id: bkt_example
                    email:
                      address: acme-orders@revdokumail.com
                      receiving_enabled: true
                      sending_enabled: false
                    account_id: acct_example
              schema:
                $ref: "#/components/schemas/createMailbox_201_response"
          description: Created mailbox with its confirmed receiving address.
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createMailbox_201_response"
          description: Created mailbox with its confirmed receiving address.
        "401":
          content:
            application/json:
              example:
                success: false
                error:
                  code: UNAUTHORIZED
                  message: Authentication required
                  request_id: req_example
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Missing, invalid or expired API credential."
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Request failed; see error.code and error.details. A 503 EMAIL_INDEX_BUILDING\
            \ includes Retry-After: 5."
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Request failed; see error.code and error.details. A 503 EMAIL_INDEX_BUILDING\
            \ includes Retry-After: 5."
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Request failed; see error.code and error.details. A 503 EMAIL_INDEX_BUILDING\
            \ includes Retry-After: 5."
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Request failed; see error.code and error.details. A 503 EMAIL_INDEX_BUILDING\
            \ includes Retry-After: 5."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Request failed; see error.code and error.details. A 503 EMAIL_INDEX_BUILDING\
            \ includes Retry-After: 5."
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "EMAIL_NOT_READY: receiving could not be confirmed within 25\
            \ seconds. error.details.mailbox_id identifies the retained mailbox; do\
            \ not create a replacement blindly."
      security:
      - bearerAuth: []
      summary: Create a mailbox with a ready receiving address
      x-content-type: application/json
      x-accepts:
      - application/json
  /v1/mailboxes/{id}:
    get:
      description: "Read mailbox details. List files, emails, versions and account\
        \ limits through their separate endpoints."
      operationId: getMailbox
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - description: Include additional address settings and aliases. Requires write
          access. Ordinary reads already include receiving state and the permitted
          address.
        explode: true
        in: query
        name: include_email
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - explode: true
        in: query
        name: account_id
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: reason
        required: false
        schema:
          $ref: "#/components/schemas/ActionReason"
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createMailbox_201_response"
          description: Mailbox details including email address/receiving state when
            authorized.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Requested address requires upload/write access.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Request failed; see error.code and error.details. A 503 EMAIL_INDEX_BUILDING\
            \ includes Retry-After: 5."
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Request failed; see error.code and error.details. A 503 EMAIL_INDEX_BUILDING\
            \ includes Retry-After: 5."
      security:
      - bearerAuth: []
      summary: Read mailbox activity and optionally its incoming address
      x-accepts:
      - application/json
  /v1/account/email_domains:
    get:
      description: Full-account owner/administrator authorization required. Cookie-authenticated
        writes require CSRF. Check the returned domain setup availability. Never change
        customer DNS without explicit authorization.
      operationId: listAccountEmailDomains
      parameters:
      - description: Explicit granted account for this call; omission uses the credential
          account.
        explode: true
        in: query
        name: account_id
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: reason
        required: false
        schema:
          $ref: "#/components/schemas/ActionReason"
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailDomainListResponse"
          description: Current domain configuration or result
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Account admin/full-account access or domain setup entitlement
            required
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Domain is still in use
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Invalid hostname, DNS conflict, or missing confirmation"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Setup rate limit; follow Retry-After
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Temporary provider/DNS error; details.retryable is true
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Request failed; see error.code and error.details. A 503 EMAIL_INDEX_BUILDING\
            \ includes Retry-After: 5."
      security:
      - bearerAuth: []
      summary: "List account email domains, DNS records, receiving state and usage"
      x-accepts:
      - application/json
    post:
      description: Full-account owner/administrator authorization required. Cookie-authenticated
        writes require CSRF. Check the returned domain setup availability. Never change
        customer DNS without explicit authorization.
      operationId: createAccountEmailDomain
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createAccountEmailDomain_request"
        required: true
      responses:
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Account admin/full-account access or domain setup entitlement
            required
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Domain is still in use
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Invalid hostname, DNS conflict, or missing confirmation"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Setup rate limit; follow Retry-After
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Temporary provider/DNS error; details.retryable is true
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailDomainListResponse"
          description: Exact domain claim created; add returned ownership TXT and
            verify.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Request failed; see error.code and error.details. A 503 EMAIL_INDEX_BUILDING\
            \ includes Retry-After: 5."
      security:
      - bearerAuth: []
      summary: Claim an exact email domain
      x-content-type: application/json
      x-accepts:
      - application/json
  /v1/account/email_domains/{id}:
    delete:
      description: Full-account owner/administrator authorization required. Cookie-authenticated
        writes require CSRF. Check the returned domain setup availability. Never change
        customer DNS without explicit authorization.
      operationId: removeAccountEmailDomain
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/removeAccountEmailDomain_request"
        required: true
      responses:
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Account admin/full-account access or domain setup entitlement
            required
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Domain is still in use
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Invalid hostname, DNS conflict, or missing confirmation"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Setup rate limit; follow Retry-After
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Temporary provider/DNS error; details.retryable is true
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailDomainListResponse"
          description: Verification/removal queued; poll the resource
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Request failed; see error.code and error.details. A 503 EMAIL_INDEX_BUILDING\
            \ includes Retry-After: 5."
      security:
      - bearerAuth: []
      summary: Remove unused receiving domain after confirmation
      x-content-type: application/json
      x-accepts:
      - application/json
    get:
      description: Full-account owner/administrator authorization required. Cookie-authenticated
        writes require CSRF. Check the returned domain setup availability. Never change
        customer DNS without explicit authorization.
      operationId: getAccountEmailDomain
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - description: Explicit granted account for this call; omission uses the credential
          account.
        explode: true
        in: query
        name: account_id
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: reason
        required: false
        schema:
          $ref: "#/components/schemas/ActionReason"
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailDomainResponse"
          description: Current domain configuration or result
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Account admin/full-account access or domain setup entitlement
            required
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Domain is still in use
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Invalid hostname, DNS conflict, or missing confirmation"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Setup rate limit; follow Retry-After
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Temporary provider/DNS error; details.retryable is true
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Request failed; see error.code and error.details. A 503 EMAIL_INDEX_BUILDING\
            \ includes Retry-After: 5."
      security:
      - bearerAuth: []
      summary: Read exact domain setup state
      x-accepts:
      - application/json
  /v1/account/email_domains/{id}/verify:
    post:
      description: Full-account owner/administrator authorization required. Cookie-authenticated
        writes require CSRF. Check the returned domain setup availability. Never change
        customer DNS without explicit authorization.
      operationId: verifyAccountEmailDomain
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/verifyAccountEmailDomain_request"
        required: false
      responses:
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Account admin/full-account access or domain setup entitlement
            required
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Domain is still in use
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Invalid hostname, DNS conflict, or missing confirmation"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Setup rate limit; follow Retry-After
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Temporary provider/DNS error; details.retryable is true
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailDomainListResponse"
          description: Verification/removal queued; poll the resource
        default:
          content:
            application/json:
              schema:
