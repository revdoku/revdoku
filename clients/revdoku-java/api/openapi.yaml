components:
  parameters:
    AccountId:
      description: Select another granted account; otherwise use the credential default.
      explode: true
      in: query
      name: account_id
      required: false
      schema:
        type: string
      style: form
    Purpose:
      description: Background reads do not change read status.
      explode: true
      in: query
      name: purpose
      required: false
      schema:
        default: open
        enum:
        - open
        - background
        type: string
      style: form
    Reason:
      explode: true
      in: query
      name: reason
      required: false
      schema:
        $ref: "#/components/schemas/ActionReason"
      style: form
  responses:
    ApiError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
      description: "Request failed; see error.code and error.details. A 503 EMAIL_INDEX_BUILDING\
        \ includes Retry-After: 5."
  schemas:
    AccountIdentity:
      example:
        id: id
        name: name
        account_kind: standard
        client_name: client_name
        agency_account:
          id: id
          name: name
        region: region
        status: active
        permissions:
          scope: scope
          mailbox_access: mailbox_access
          can_create_mailboxes: true
      properties:
        id:
          type: string
        name:
          description: "Account name, separate from the client person or business."
          type: string
        account_kind:
          enum:
          - standard
          - agency
          - client
          type: string
        client_name:
          description: "Client person or business name, or null when unset."
          maxLength: 100
          nullable: true
          type: string
        agency_account:
          $ref: "#/components/schemas/AccountIdentity_agency_account"
        region:
          nullable: true
          type: string
        status:
          enum:
          - active
          - read_only
          type: string
        permissions:
          $ref: "#/components/schemas/AccountIdentity_permissions"
      required:
      - account_kind
      - agency_account
      - client_name
      - id
      - name
      type: object
    MailboxEmail:
      description: "Mailbox reads include stored and unread email counts, lifetime\
        \ receipts, receiving state and the permitted address. Creation and include_email\
        \ reads also include additional address settings."
      example:
        address: address
        received_count: 0
        last_received_at: 2000-01-23T04:56:07.000+00:00
        last_received_path: last_received_path
        blocked_reason: blocked_reason
        available_domains:
        - hostname: hostname
          kind: platform
        - hostname: hostname
          kind: platform
        assignment:
          id: id
          status: pending
          hostname: hostname
          error:
            code: code
            message: message
            retryable: true
        customization:
          allowed: true
          blocked_reason: blocked_reason
          settings_url: settings_url
        receiving_enabled: true
        sender_allowlist:
          enabled: true
          entries:
          - entries
          - entries
          - entries
          - entries
          - entries
          version: version
          max_entries: 6
          editable: true
        username: username
