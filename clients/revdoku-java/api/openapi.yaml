openapi: 3.0.3
info:
  description: "Email mailboxes for people and AI agents, with private file storage.\
    \ Create mailboxes, read and reply to email, and store files. Guide: https://revdoku.com/api.md.\
    \ Create an account at https://app.revdoku.com/users/sign_up."
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Revdoku API
  version: 2.0.1
servers:
- description: Revdoku application API
  url: https://api.revdoku.com
security:
- bearerAuth: []
paths:
  /v1/agent_auth/request_code:
    post:
      description: "Sends a six-digit code to an existing account email. The response\
        \ is the same for every address, so it never reveals whether an account exists.\
        \ Create new accounts in the browser at https://app.revdoku.com/users/sign_up."
      operationId: requestSignInCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/requestSignInCode_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/requestSignInCode_200_response"
          description: Success
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Request failed. See error.code. 429 and some 503 responses
            include Retry-After.
      security: []
      summary: Email a sign-in code
      x-content-type: application/json
      x-accepts:
      - application/json
  /v1/agent_auth/verify_code:
    post:
      description: Creates an AI agent connection for an account owner or administrator.
        Accounts with two-factor authentication must use browser sign-in.
      operationId: verifySignInCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/verifySignInCode_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/verifySignInCode_201_response"
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Request failed. See error.code. 429 and some 503 responses
            include Retry-After.
      security: []
      summary: Exchange a sign-in code for an API key
      x-content-type: application/json
      x-accepts:
      - application/json
  /v1/agent_auth/exchange_grant:
    post:
      description: The dashboard creates the one-time code when a signed-in administrator
        copies a connection prompt.
      operationId: exchangeConnectionGrant
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/exchangeConnectionGrant_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/verifySignInCode_201_response"
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Request failed. See error.code. 429 and some 503 responses
            include Retry-After.
      security: []
      summary: Exchange a one-time dashboard connection code for an API key
      x-content-type: application/json
      x-accepts:
      - application/json
  /v1/agent_auth/browser_login_link:
    post:
      description: Returns a dashboard URL for a path such as /mailboxes. The user
        signs in normally; the link grants no access.
      operationId: createBrowserLink
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createBrowserLink_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createBrowserLink_201_response"
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Request failed. See error.code. 429 and some 503 responses
            include Retry-After.
      summary: Create a dashboard link for the user
      x-content-type: application/json
      x-accepts:
      - application/json
  /v1/status:
    get:
      description: "Works with every API key, including mailbox-scoped keys. Read\
        \ quotas with GET /v1/account/limits."
      operationId: getStatus
      parameters:
      - description: "Select another granted account for this request. Omit to use\
          \ the credential default. In JSON bodies, send account_id as a body field\
          \ instead."
        explode: true
        in: query
        name: account_id
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: reason
        required: false
        schema:
          $ref: "#/components/schemas/ActionReason"
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getStatus_200_response"
          description: Success
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Request failed. See error.code. 429 and some 503 responses
            include Retry-After.
      summary: Read the connection and selected account
      x-accepts:
      - application/json
  /v1/accounts:
    get:
      operationId: listAccounts
      parameters:
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 200
          minimum: 1
          type: integer
        style: form
      - description: pagination.next_cursor from the previous page.
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listAccounts_200_response"
          description: Success
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Request failed. See error.code. 429 and some 503 responses
            include Retry-After.
      summary: List accounts granted to this credential
      x-accepts:
      - application/json
    post:
      description: Requires an agency owner credential with client-account access.
        The credential default does not change; send the new account_id on later requests.
      operationId: createClientAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createClientAccount_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createClientAccount_201_response"
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Request failed. See error.code. 429 and some 503 responses
            include Retry-After.
      summary: Create a client account
      x-content-type: application/json
      x-accepts:
      - application/json
  /v1/accounts/{account_id}:
    get:
      operationId: getAccount
      parameters:
      - description: Granted account to read.
        explode: false
        in: path
        name: account_id
        required: true
        schema:
          pattern: ^acct_
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createClientAccount_201_response"
          description: Success
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Request failed. See error.code. 429 and some 503 responses
            include Retry-After.
      summary: Read one granted account
      x-accepts:
      - application/json
  /v1/account/limits:
    get:
      description: "Values come from the plan and account overrides. Zero means no\
        \ allowance; null means no cap. Storage, mailbox and email traffic allowances\
        \ are shared within a billing group."
      operationId: getAccountLimits
      parameters:
      - description: "Select another granted account for this request. Omit to use\
          \ the credential default. In JSON bodies, send account_id as a body field\
          \ instead."
        explode: true
        in: query
        name: account_id
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccountLimits_200_response"
          description: Success
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Request failed. See error.code. 429 and some 503 responses
            include Retry-After.
      summary: Read effective account limits
      x-accepts:
      - application/json
  /v1/account/email_domains:
    get:
      description: Requires a full-account owner or administrator credential.
      operationId: listEmailDomains
      parameters:
      - description: "Select another granted account for this request. Omit to use\
          \ the credential default. In JSON bodies, send account_id as a body field\
          \ instead."
        explode: true
        in: query
        name: account_id
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 200
          minimum: 1
          type: integer
        style: form
      - description: pagination.next_cursor from the previous page.
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listEmailDomains_200_response"
          description: Success
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Request failed. See error.code. 429 and some 503 responses
            include Retry-After.
      summary: List custom email domains
      x-accepts:
      - application/json
    post:
      description: Claims an exact hostname and returns the DNS records to publish.
        Never change DNS without the domain owner's authorization.
      operationId: createEmailDomain
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createEmailDomain_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createEmailDomain_201_response"
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Request failed. See error.code. 429 and some 503 responses
            include Retry-After.
      summary: Connect a custom email domain
      x-content-type: application/json
      x-accepts:
      - application/json
  /v1/account/email_domains/check:
    post:
      description: "Makes no claim and changes no DNS. If the root domain already\
        \ receives email, use an unused subdomain such as inbox.example.com."
      operationId: checkEmailDomain
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createEmailDomain_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/checkEmailDomain_200_response"
          description: Success
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Request failed. See error.code. 429 and some 503 responses
            include Retry-After.
      summary: Check a hostname for conflicting DNS
      x-content-type: application/json
      x-accepts:
      - application/json
  /v1/account/email_domains/{domain_id}:
    delete:
      description: Send the domain hostname and confirm=true. A domain that mailbox
        addresses still use returns EMAIL_DOMAIN_IN_USE.
      operationId: deleteEmailDomain
      parameters:
      - explode: false
        in: path
        name: domain_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/deleteEmailDomain_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/deleteEmailDomain_200_response"
          description: Deleted
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Request failed. See error.code. 429 and some 503 responses
            include Retry-After.
      summary: Remove an unused custom email domain
      x-content-type: application/json
      x-accepts:
      - application/json
    get:
      operationId: getEmailDomain
      parameters:
      - explode: false
        in: path
        name: domain_id
        required: true
        schema:
          type: string
        style: simple
      - description: "Select another granted account for this request. Omit to use\
          \ the credential default. In JSON bodies, send account_id as a body field\
          \ instead."
        explode: true
        in: query
        name: account_id
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createEmailDomain_201_response"
          description: Success
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Request failed. See error.code. 429 and some 503 responses
            include Retry-After.
      summary: Read a custom email domain
      x-accepts:
      - application/json
  /v1/account/email_domains/{domain_id}/verify:
    post:
      description: Queues the check and returns the current state. Read the domain
        again to see the result.
      operationId: verifyEmailDomain
      parameters:
      - explode: false
        in: path
        name: domain_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/verifyEmailDomain_request"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createEmailDomain_201_response"
          description: Accepted
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Request failed. See error.code. 429 and some 503 responses
            include Retry-After.
      summary: Check DNS and provider setup again
      x-content-type: application/json
      x-accepts:
      - application/json
  /v1/mailboxes:
    get:
      description: "Lists active mailboxes by default, newest first. Counts and pages\
        \ cover only mailboxes this credential can access. Reads no email content."
      operationId: listMailboxes
      parameters:
      - description: "Select another granted account for this request. Omit to use\
          \ the credential default. In JSON bodies, send account_id as a body field\
          \ instead."
        explode: true
        in: query
        name: account_id
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: reason
        required: false
        schema:
          $ref: "#/components/schemas/ActionReason"
        style: form
      - explode: true
        in: query
        name: status
        required: false
        schema:
          default: active
          enum:
          - active
          - archived
          - all
          type: string
        style: form
      - description: Case-insensitive text in the permitted address or the mailbox
          ID.
        explode: true
        in: query
        name: q
        required: false
        schema:
          maxLength: 500
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 200
          minimum: 1
          type: integer
        style: form
      - description: pagination.next_cursor from the previous page.
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listMailboxes_200_response"
          description: Success
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Request failed. See error.code. 429 and some 503 responses
            include Retry-After.
      summary: List mailboxes
      x-accepts:
      - application/json
    post:
      description: "Waits until the address can receive email. On Free, email.username\
        \ is a prefix with a permanent random suffix; an exact name requires a paid\
        \ plan. If confirmation does not finish, EMAIL_NOT_READY returns the created\
        \ mailbox_id in error.details: read that mailbox instead of creating another.\
        \ Never retry a creation automatically."
      operationId: createMailbox
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createMailbox_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              example:
                success: true
                data:
                  mailbox:
                    id: bkt_example
                    email:
                      address: acme.orders.k7m2x9q4v8nc@revdokumail.com
                      receiving_enabled: true
                      sending_enabled: true
              schema:
                $ref: "#/components/schemas/createMailbox_201_response"
          description: Created
        "401":
          content:
            application/json:
              example:
                success: false
                error:
                  code: UNAUTHORIZED
                  message: Authentication required
                  request_id: req_example
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Missing or invalid API key
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Request failed. See error.code. 429 and some 503 responses
            include Retry-After.
      summary: Create a mailbox
      x-content-type: application/json
      x-accepts:
      - application/json
  /v1/mailboxes/{mailbox_id}:
    delete:
      description: Archive the mailbox first. Send delete.confirmation from the mailbox
        read after the user confirms. Large mailboxes finish deleting in the background.
      operationId: deleteMailbox
      parameters:
      - explode: false
        in: path
        name: mailbox_id
        required: true
        schema:
          pattern: ^bkt_
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/deleteMailbox_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/deleteEmailDomain_200_response"
          description: Deleted
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Request failed. See error.code. 429 and some 503 responses
            include Retry-After.
      summary: Permanently delete an archived mailbox
      x-content-type: application/json
      x-accepts:
      - application/json
    get:
      description: "Reading never changes the mailbox. Read address settings, emails\
        \ and files through their own endpoints."
      operationId: getMailbox
      parameters:
      - explode: false
        in: path
        name: mailbox_id
        required: true
        schema:
          pattern: ^bkt_
          type: string
        style: simple
      - description: "Select another granted account for this request. Omit to use\
          \ the credential default. In JSON bodies, send account_id as a body field\
          \ instead."
        explode: true
        in: query
        name: account_id
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: reason
        required: false
        schema:
          $ref: "#/components/schemas/ActionReason"
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createMailbox_201_response"
          description: Success
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Request failed. See error.code. 429 and some 503 responses
            include Retry-After.
      summary: Read a mailbox
      x-accepts:
      - application/json
    patch:
      description: "metadata must be a JSON object. It replaces the stored object;\
        \ {} clears it. Send expected_metadata_version from your last read; a stale\
        \ value changes nothing and returns MAILBOX_METADATA_CONFLICT."
      operationId: updateMailbox
      parameters:
      - explode: false
        in: path
        name: mailbox_id
        required: true
        schema:
          pattern: ^bkt_
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/updateMailbox_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createMailbox_201_response"
          description: Success
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Request failed. See error.code. 429 and some 503 responses
            include Retry-After.
      summary: Update a mailbox description or metadata
      x-content-type: application/json
      x-accepts:
      - application/json
  /v1/mailboxes/{mailbox_id}/archive:
    post:
      description: Archived mailboxes keep their files and emails and become read-only.
      operationId: archiveMailbox
      parameters:
      - explode: false
        in: path
        name: mailbox_id
        required: true
        schema:
          pattern: ^bkt_
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createMailbox_201_response"
          description: Success
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Request failed. See error.code. 429 and some 503 responses
            include Retry-After.
      summary: Archive a mailbox
      x-content-type: application/json
      x-accepts:
      - application/json
  /v1/mailboxes/{mailbox_id}/unarchive:
    post:
      operationId: unarchiveMailbox
      parameters:
      - explode: false
        in: path
        name: mailbox_id
        required: true
        schema:
          pattern: ^bkt_
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createMailbox_201_response"
          description: Success
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Request failed. See error.code. 429 and some 503 responses
            include Retry-After.
      summary: Unarchive a mailbox
      x-content-type: application/json
      x-accepts:
      - application/json
  /v1/mailboxes/{mailbox_id}/email:
    get:
      description: Requires mailbox write permission.
      operationId: getMailboxEmailSettings
      parameters:
      - explode: false
        in: path
        name: mailbox_id
        required: true
        schema:
          pattern: ^bkt_
          type: string
        style: simple
      - description: "Select another granted account for this request. Omit to use\
          \ the credential default. In JSON bodies, send account_id as a body field\
          \ instead."
        explode: true
        in: query
        name: account_id
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: reason
        required: false
        schema:
          $ref: "#/components/schemas/ActionReason"
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getMailboxEmailSettings_200_response"
          description: Success
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Request failed. See error.code. 429 and some 503 responses
            include Retry-After.
      summary: Read address settings
      x-accepts:
      - application/json
  /v1/mailboxes/{mailbox_id}/email/rotate:
    post:
      description: Requires a paid plan and mailbox admin permission. Send the current
        address as expected_address. Omit username for a generated name. A custom-domain
        change returns 202; read the settings until assignment.status is active or
        failed. The old address stops receiving unless keep_old_as_alias is true.
      operationId: changeMailboxAddress
      parameters:
      - explode: false
        in: path
        name: mailbox_id
        required: true
        schema:
          pattern: ^bkt_
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/changeMailboxAddress_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getMailboxEmailSettings_200_response"
          description: Success
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getMailboxEmailSettings_200_response"
          description: Change pending
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Request failed. See error.code. 429 and some 503 responses
