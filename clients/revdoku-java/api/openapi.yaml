        \ match exact authenticated From addresses or domains, with no wildcards or\
        \ implicit subdomains. A stale or missing version returns EMAIL_ALLOWLIST_CHANGED;\
        \ invalid entries return EMAIL_ALLOWLIST_INVALID. Disabled policies retain\
        \ the supplied entries. Locks and read-only account state apply."
      operationId: updateMailboxEmailAllowlist
      parameters:
      - description: Authorized mailbox prefix ID
        explode: false
        in: path
