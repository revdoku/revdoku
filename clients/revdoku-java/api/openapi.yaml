  /v1/mailboxes/{mailbox_id}/upload_sessions:
    post:
      description: "Starts an upload session for many files and returns storage targets\
        \ for the first files. The session locks the mailbox for other writers; incoming\
        \ email still arrives. Send files in batches with POST .../uploads, PUT the\
        \ bytes to each upload.url, save each batch with POST .../finalize_batch,\
        \ then call POST .../finalize. Unsaved uploads are discarded when the session\
        \ expires."
      operationId: createUploadSession
      parameters:
      - explode: false
        in: path
        name: mailbox_id
        required: true
        schema:
          pattern: ^bkt_
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            example:
              expected_file_count: 2
              client_session_key: backup-2026-10-11
              files:
              - path: reports/q3.pdf
                byte_size: 48213
                content_type: application/pdf
                checksum: rL0Y20zC+Fzt72VPzMSk2A==
                sha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
            schema:
              $ref: "#/components/schemas/createUploadSession_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              example:
                success: true
                data:
                  mailbox_upload_session:
                    id: bus_example
                    mailbox_id: bkt_example
                    status: pending
                    base_mailbox_version_id: bktrv_example
                    target_mailbox_version_id: null
                    uploads_expire_at: 2026-10-11T14:00:00Z
                    session_closed_at: null
                    files_count: 2
                    pending_files_count: 2
                    uploaded_files_count: 0
                    finalized_files_count: 0
                    skipped_files_count: 0
                    skipped_code_counts: {}
                    failed_files_count: 0
                  uploads:
                  - input_index: 0
                    path: reports/q3.pdf
                    name: q3.pdf
                    signed_blob_id: eyJfcmFpbHMi...
                    upload:
                      url: https://storage.example/upload
                      headers:
                        Content-Type: application/pdf
                        Content-MD5: rL0Y20zC+Fzt72VPzMSk2A==
                  uploaded: []
                  uploaded_count: 0
                  uploaded_truncated: false
                  created_count: 0
                  updated_count: 0
                  skipped: []
                  skipped_count: 0
                  skipped_truncated: false
              schema:
                $ref: "#/components/schemas/createUploadSession_201_response"
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Request failed. See error.code. 429 and some 503 responses
            include Retry-After.
      summary: Start a batch upload
      x-content-type: application/json
      x-accepts:
      - application/json
  /v1/mailboxes/{mailbox_id}/upload_sessions/{session_id}/uploads:
    post:
      description: "Returns upload.url and upload.headers for each file that needs\
        \ bytes. Repeating a path returns a fresh target, for example after a failed\
        \ PUT. Files with identical content are skipped."
      operationId: addUploadSessionFiles
      parameters:
      - explode: false
        in: path
        name: mailbox_id
        required: true
        schema:
          pattern: ^bkt_
          type: string
        style: simple
      - description: mailbox_upload_session.id from the create response.
        explode: false
        in: path
        name: session_id
        required: true
        schema:
          pattern: ^bus_
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/addUploadSessionFiles_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createUploadSession_201_response"
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Request failed. See error.code. 429 and some 503 responses
            include Retry-After.
      summary: Get storage targets for a batch
      x-content-type: application/json
      x-accepts:
      - application/json
  /v1/mailboxes/{mailbox_id}/upload_sessions/{session_id}/finalize_batch:
    post:
      description: Saves up to limit files whose bytes were uploaded. Call it after
        each batch to keep each request short. DIRECT_UPLOAD_NOT_FOUND names a file
        whose bytes are missing in error.details.path; upload it again and retry.
      operationId: saveUploadSessionBatch
      parameters:
      - explode: false
        in: path
        name: mailbox_id
        required: true
        schema:
          pattern: ^bkt_
          type: string
        style: simple
      - description: mailbox_upload_session.id from the create response.
        explode: false
        in: path
        name: session_id
        required: true
        schema:
          pattern: ^bus_
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/saveUploadSessionBatch_request"
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createUploadSession_201_response"
          description: Success
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Request failed. See error.code. 429 and some 503 responses
            include Retry-After.
      summary: Save uploaded files
      x-content-type: application/json
      x-accepts:
      - application/json
  /v1/mailboxes/{mailbox_id}/upload_sessions/{session_id}/finalize:
    post:
      description: "complete=true saves the remaining uploaded files, creates one\
        \ mailbox version and releases the lock. A 202 response with finalize_pending=true\
        \ means more files remain: call finalize again after Retry-After. complete=false\
        \ cancels the session and discards its unsaved files. Finalizing a finished\
        \ session returns it unchanged."
      operationId: finalizeUploadSession
      parameters:
      - explode: false
        in: path
        name: mailbox_id
        required: true
        schema:
          pattern: ^bkt_
          type: string
        style: simple
      - description: mailbox_upload_session.id from the create response.
        explode: false
        in: path
        name: session_id
        required: true
        schema:
          pattern: ^bus_
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/finalizeUploadSession_request"
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createUploadSession_201_response"
          description: Success
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createUploadSession_201_response"
          description: More files remain; call finalize again
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Request failed. See error.code. 429 and some 503 responses
            include Retry-After.
      summary: Finish or cancel a batch upload
      x-content-type: application/json
      x-accepts:
      - application/json
